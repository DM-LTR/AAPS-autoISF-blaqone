<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>The three versions of AAPS 4 + AutoISF</title>
  <rect x="0" y="0" width="760" height="300" rx="16" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Which version is for me?</text>

  <!-- normal -->
  <rect x="20" y="56" width="230" height="220" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="3"/>
  <rect x="62" y="44" width="146" height="26" rx="13" fill="#0f6e56"/>
  <text x="135" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">RECOMMENDED</text>
  <text x="135" y="98" text-anchor="middle" font-size="18" font-weight="600" fill="#085041">Normal</text>
  <text x="135" y="120" text-anchor="middle" font-size="13" fill="#085041" font-family="Consolas, monospace">aaps4-autoisf</text>
  <text x="135" y="152" text-anchor="middle" font-size="14" fill="#04342c">AutoISF 3.2.1 on AAPS 4,</text>
  <text x="135" y="172" text-anchor="middle" font-size="14" fill="#04342c">close to the original.</text>
  <text x="135" y="200" text-anchor="middle" font-size="14" fill="#04342c">Only tested features.</text>
  <text x="135" y="244" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">For everyone who</text>
  <text x="135" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">wants to use AutoISF</text>

  <!-- dev -->
  <rect x="265" y="56" width="230" height="220" rx="14" fill="#faeeda" stroke="#854f0b" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="18" font-weight="600" fill="#633806">Dev</text>
  <text x="380" y="120" text-anchor="middle" font-size="13" fill="#633806" font-family="Consolas, monospace">aaps4-autoisf-dev</text>
  <text x="380" y="152" text-anchor="middle" font-size="14" fill="#412402">Normal + features</text>
  <text x="380" y="172" text-anchor="middle" font-size="14" fill="#412402">that are still tested.</text>
  <text x="380" y="200" text-anchor="middle" font-size="14" fill="#412402">Changes often.</text>
  <text x="380" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#633806">Only for testers</text>

  <!-- sport -->
  <rect x="510" y="56" width="230" height="220" rx="14" fill="#eeedfe" stroke="#534ab7" stroke-width="2"/>
  <text x="625" y="98" text-anchor="middle" font-size="18" font-weight="600" fill="#3c3489">Sport</text>
  <text x="625" y="120" text-anchor="middle" font-size="13" fill="#3c3489" font-family="Consolas, monospace">aaps4-autoisf-sport</text>
  <text x="625" y="152" text-anchor="middle" font-size="14" fill="#26215c">Normal + my changes</text>
  <text x="625" y="172" text-anchor="middle" font-size="14" fill="#26215c">for sport (Garmin steps,</text>
  <text x="625" y="192" text-anchor="middle" font-size="14" fill="#26215c">SMB threshold, keto</text>
  <text x="625" y="212" text-anchor="middle" font-size="14" fill="#26215c">protection, ...)</text>
  <text x="625" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#3c3489">My personal mode</text>
</svg>

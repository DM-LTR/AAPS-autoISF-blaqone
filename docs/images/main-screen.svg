<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Main screen of AAPS 4 + AutoISF with the parts that are new</title>
  <rect x="0" y="0" width="820" height="560" rx="16" fill="#ffffff"/>

  <!-- phone -->
  <rect x="24" y="20" width="380" height="520" rx="30" fill="#141418"/>
  <!-- BG circle -->
  <circle cx="92" cy="104" r="46" fill="none" stroke="#5dcaa5" stroke-width="6"/>
  <text x="92" y="112" text-anchor="middle" font-size="30" font-weight="600" fill="#5dcaa5">128</text>
  <text x="92" y="132" text-anchor="middle" font-size="11" fill="#bbbbbb">20 s ago</text>
  <!-- chips -->
  <rect x="154" y="62" width="110" height="30" rx="8" fill="#173a52"/><text x="209" y="82" text-anchor="middle" font-size="13" fill="#b5d4f4">1.85 U</text>
  <rect x="272" y="62" width="114" height="30" rx="8" fill="#5a3b1c"/><text x="329" y="82" text-anchor="middle" font-size="13" fill="#f5c4b3">12 g</text>
  <rect x="154" y="100" width="232" height="30" rx="8" fill="#1e4a40"/><text x="270" y="120" text-anchor="middle" font-size="13" fill="#9fe1cb">x 116%  140 → 104</text>
  <!-- AutoISF chip -->
  <rect x="40" y="158" width="348" height="36" rx="8" fill="#1e4a40" stroke="#ef9f27" stroke-width="2"/>
  <text x="56" y="182" font-size="16" fill="#5dcaa5" font-weight="700">X</text>
  <text x="76" y="182" font-size="13" fill="#d3d1c7">AutoISF</text>
  <text x="300" y="182" text-anchor="end" font-size="13" fill="#fac775">final 1.34</text>
  <text x="372" y="182" text-anchor="end" font-size="13" fill="#d3d1c7">iobTH 5.8 U ▾</text>
  <!-- graph -->
  <rect x="40" y="208" width="348" height="210" rx="10" fill="#1b1b20" stroke="#ef9f27" stroke-width="2"/>
  <rect x="40" y="268" width="348" height="70" fill="#1d9e75" opacity="0.18"/>
  <g fill="none" stroke="#888888" stroke-width="1.2" opacity="0.7">
    <circle cx="60" cy="250" r="3"/><circle cx="80" cy="256" r="3"/><circle cx="100" cy="264" r="3"/><circle cx="120" cy="270" r="3"/><circle cx="140" cy="279" r="3"/><circle cx="160" cy="286" r="3"/><circle cx="180" cy="292" r="3"/><circle cx="200" cy="296" r="3"/><circle cx="220" cy="300" r="3"/><circle cx="240" cy="303" r="3"/>
  </g>
  <g fill="#5dcaa5">
    <circle cx="60" cy="252" r="3.5"/><circle cx="80" cy="257" r="3.5"/><circle cx="100" cy="263" r="3.5"/><circle cx="120" cy="271" r="3.5"/><circle cx="140" cy="278" r="3.5"/><circle cx="160" cy="285" r="3.5"/><circle cx="180" cy="291" r="3.5"/><circle cx="200" cy="296" r="3.5"/><circle cx="220" cy="299" r="3.5"/><circle cx="240" cy="302" r="3.5"/>
  </g>
  <polyline points="160,286 180,292 200,297 220,300 240,303" fill="none" stroke="#ff00ff" stroke-width="3"/>
  <polyline points="240,303 270,306 300,308 330,309" fill="none" stroke="#ff00ff" stroke-width="3" stroke-dasharray="6 5"/>
  <g fill="#85b7eb"><circle cx="260" cy="304" r="2.5"/><circle cx="280" cy="306" r="2.5"/><circle cx="300" cy="307" r="2.5"/><circle cx="320" cy="307" r="2.5"/><circle cx="340" cy="306" r="2.5"/><circle cx="360" cy="305" r="2.5"/></g>
  <line x1="240" y1="216" x2="240" y2="410" stroke="#999999" stroke-dasharray="3 4"/>
  <!-- hold pill -->
  <rect x="120" y="222" width="190" height="26" rx="13" fill="#2b2b31"/>
  <text x="140" y="240" font-size="13" fill="#bbbbbb">17:42</text>
  <text x="188" y="240" font-size="13" fill="#5dcaa5" font-weight="600">128</text>
  <text x="220" y="240" font-size="13" fill="#9a9aa3">(raw 131)</text>
  <!-- status lights -->
  <rect x="40" y="432" width="348" height="36" rx="10" fill="#2b2b31"/>
  <text x="214" y="455" text-anchor="middle" font-size="13" fill="#bbbbbb">status lights</text>

  <!-- callouts -->
  <g font-size="14" fill="#1f2328">
    <circle cx="430" cy="176" r="12" fill="#ef9f27"/><text x="430" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="452" y="171" font-weight="600">AutoISF chip</text>
    <text x="452" y="190">Values of the last loop run. Tap: open,</text>
    <text x="452" y="208">tap a value: pin it. Long press: AutoISF screen.</text>

    <circle cx="430" cy="252" r="12" fill="#ef9f27"/><text x="430" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="452" y="247" font-weight="600">Coloured dot every minute</text>
    <text x="452" y="266">With a 1 minute CGM and UKF: the smoothed</text>
    <text x="452" y="284">value of each reading. Grey ring: raw value.</text>

    <circle cx="430" cy="320" r="12" fill="#ef9f27"/><text x="430" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="452" y="315" font-weight="600">Pink BG parabola</text>
    <text x="452" y="334">The parabola AutoISF fitted for acce_ISF,</text>
    <text x="452" y="352">dashed 20 minutes ahead.</text>

    <circle cx="430" cy="388" r="12" fill="#ef9f27"/><text x="430" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="452" y="383" font-weight="600">Hold a point</text>
    <text x="452" y="402">Smoothed value in its colour,</text>
    <text x="452" y="420">raw value in grey brackets.</text>
  </g>
  <line x1="388" y1="176" x2="418" y2="176" stroke="#ef9f27" stroke-width="2"/>
  <line x1="246" y1="300" x2="418" y2="252" stroke="#ef9f27" stroke-width="2"/>
  <line x1="320" y1="309" x2="418" y2="320" stroke="#ef9f27" stroke-width="2"/>
  <line x1="310" y1="236" x2="418" y2="388" stroke="#ef9f27" stroke-width="2"/>
</svg>
